# ALB always sets X-Forwarded-Proto: https (TLS terminates there); fall back to
# $scheme (http) when accessed directly, e.g. local `docker run -p 8080:8080`.
map $http_x_forwarded_proto $redirect_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (Aikido: CSP, HSTS, anti-clickjacking).
    # script-src/style-src need 'unsafe-inline': Next.js App Router's RSC
    # hydration payload ships as inline <script> blocks (not JSON, not
    # nonce-able on a static export with no per-request server), and React's
    # inline style={{...}} bars (RunHistoryPanel etc.) set the style
    # attribute directly via the DOM, which CSP treats the same as inline
    # markup. No third-party script/style/font/image origins are loaded
    # (checked ui/out's built HTML directly), so everything else stays 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;

    # API → uvicorn on localhost; trailing slash on proxy_pass strips the /api prefix
    # (so /api/health → uvicorn /health, /api/optimize → uvicorn /optimize).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE support: disable buffering for streaming responses
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # FastAPI's default Swagger UI/ReDoc pages load their JS/CSS from a CDN
    # (cdn.jsdelivr.net, plus Google Fonts for ReDoc), which the strict CSP
    # above blocks entirely. `location =` is an exact match, always
    # prioritized over the `/api/` prefix block regardless of order, so these
    # two paths get a scoped CDN exception without loosening CSP anywhere
    # else (including /api/openapi.json, which is untouched - it's just JSON).
    location = /api/docs {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/redoc {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self'; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        proxy_pass http://127.0.0.1:8000/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect to /en (default locale) with an absolute URL so a bare "/en"
    # isn't misread. $http_host (not $host) keeps the port for local `docker
    # run -p 8080:8080`, and matches the ALB's Host header (no port) in prod.
    # Scheme: see map above.
    location = / {
        return 301 $redirect_scheme://$http_host/en;
    }

    # Next.js static export clean URLs: /en/demo → /en/demo.html
    location / {
        # The export emits both foo.html and an empty foo/ directory (nested
        # routes like en/demo). A trailing-slash request matches foo/ as $uri
        # before try_files reaches $uri.html, and autoindex off makes that a
        # 403 (not 404). Strip the trailing slash so it falls through to .html.
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri.html $uri/ =404;
    }
}
