# ALB always sets X-Forwarded-Proto: https (TLS terminates there); fall back to
# $scheme (http) when accessed directly, e.g. local `docker run -p 8080:8080`.
map $http_x_forwarded_proto $redirect_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # API → uvicorn on localhost; trailing slash on proxy_pass strips the /api prefix
    # (so /api/health → uvicorn /health, /api/optimize → uvicorn /optimize).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE support: disable buffering for streaming responses
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Redirect to /en (default locale) with an absolute URL so a bare "/en"
    # isn't misread. $http_host (not $host) keeps the port for local `docker
    # run -p 8080:8080`, and matches the ALB's Host header (no port) in prod.
    # Scheme: see map above.
    location = / {
        return 301 $redirect_scheme://$http_host/en;
    }

    # Next.js static export clean URLs: /en/demo → /en/demo.html
    location / {
        # The export emits both foo.html and an empty foo/ directory (nested
        # routes like en/demo). A trailing-slash request matches foo/ as $uri
        # before try_files reaches $uri.html, and autoindex off makes that a
        # 403 (not 404). Strip the trailing slash so it falls through to .html.
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri.html $uri/ =404;
    }
}
