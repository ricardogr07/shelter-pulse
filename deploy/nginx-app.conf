# ALB always sets X-Forwarded-Proto: https (TLS terminates there); fall back to
# $scheme (http) when accessed directly, e.g. local `docker run -p 8080:8080`.
map $http_x_forwarded_proto $redirect_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # API → uvicorn on localhost; trailing slash on proxy_pass strips the /api prefix
    # (so /api/health → uvicorn /health, /api/optimize → uvicorn /optimize).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE support: disable buffering for streaming responses
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Root redirect → /en (default locale)
    # Absolute URL avoids a bare "/en" being misread; $http_host (not $host)
    # keeps the port for local `docker run -p 8080:8080` access, and matches
    # the ALB's Host header (no port) in production. Scheme: see map above.
    location = / {
        return 301 $redirect_scheme://$http_host/en;
    }

    # Next.js static export clean URLs: /en/demo → /en/demo.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
