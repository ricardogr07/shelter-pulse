<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1260" viewBox="0 0 1760 1260" font-family="Helvetica, Arial, sans-serif">
<title>Data Flow — Optimization Sweep (POST /optimize)</title>
<rect width="1760" height="1260" fill="#ffffff"></rect>

