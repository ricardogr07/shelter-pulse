<g>
  <rect x="770" y="380" width="892" height="290" rx="4" fill="rgba(244,244,245,0.35)" stroke="#a1a1aa" stroke-width="1.5"></rect>
  <path d="M770,380 h100 q8,0 8,8 v20 q0,8 -8,8 h-100 z" fill="#e4e4e7" stroke="#a1a1aa" stroke-width="1.5"></path>
  <text x="782" y="400" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#3f3f46">loop ×5 baselines</text>

  <rect x="1106" y="458" width="556" height="142" rx="4" fill="rgba(228,228,231,0.5)" stroke="#71717a" stroke-width="1.5"></rect>
  <path d="M1106,458 h195 q8,0 8,8 v20 q0,8 -8,8 h-195 z" fill="#d4d4d8" stroke="#71717a" stroke-width="1.5"></path>
  <text x="1118" y="478" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#3f3f46">loop: same seed_set every time</text>

  <rect x="770" y="700" width="892" height="290" rx="4" fill="rgba(244,244,245,0.35)" stroke="#a1a1aa" stroke-width="1.5"></rect>
  <path d="M770,700 h115 q8,0 8,8 v20 q0,8 -8,8 h-115 z" fill="#e4e4e7" stroke="#a1a1aa" stroke-width="1.5"></path>
  <text x="782" y="720" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#3f3f46">loop ×n_candidates</text>

  <rect x="1106" y="778" width="556" height="142" rx="4" fill="rgba(228,228,231,0.5)" stroke="#71717a" stroke-width="1.5"></rect>
  <path d="M1106,778 h195 q8,0 8,8 v20 q0,8 -8,8 h-195 z" fill="#d4d4d8" stroke="#71717a" stroke-width="1.5"></path>
  <text x="1118" y="798" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#3f3f46">loop: same seed_set every time</text>
</g>


