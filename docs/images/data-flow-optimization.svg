<rect x="770" y="300" width="500" height="42" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"></rect>
<text x="786" y="316" font-size="9.5" font-weight="700" letter-spacing="0.05em" fill="#b45309">NOTE — WORKFLOW.PY</text>
<text x="786" y="333" font-size="12" font-weight="600" fill="#78350f">seed_set fixed here — same seeds used for every candidate (CRN)</text>


<rect x="880" y="1020" width="500" height="42" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"></rect>
<text x="896" y="1036" font-size="9.5" font-weight="700" letter-spacing="0.05em" fill="#b45309">NOTE — WORKFLOW.PY (SELF)</text>
<text x="896" y="1053" font-size="12" font-weight="600" fill="#78350f">rank: feasible first (cost ≤ budget), then overflow ascending</text>


<g font-size="12" font-weight="600" fill="#27272a">
  <rect x="233" y="160" width="290" height="18" fill="#ffffff"></rect>
  <text x="378" y="174" text-anchor="middle">POST <tspan font-family="Menlo, Consolas, monospace">/optimize</tspan> {n_candidates, n_reps, use_bo}</text>

  <rect x="614" y="240" width="200" height="18" fill="#ffffff"></rect>
  <text x="714" y="254" text-anchor="middle" font-family="Menlo, Consolas, monospace">run_optimization_sweep(...)</text>

  <rect x="900" y="410" width="300" height="18" fill="#ffffff"></rect>
  <text x="1050" y="424" text-anchor="middle" font-family="Menlo, Consolas, monospace">evaluate_candidate(baseline_alloc, ...)</text>

  <rect x="1250" y="490" width="230" height="18" fill="#ffffff"></rect>
  <text x="1365" y="504" text-anchor="middle" font-family="Menlo, Consolas, monospace">run_simulation(...)</text>

  <rect x="1240" y="550" width="220" height="18" fill="#ffffff"></rect>
  <text x="1350" y="564" text-anchor="middle">returns <tspan font-family="Menlo, Consolas, monospace">SimulationResult</tspan></text>

  <rect x="890" y="615" width="420" height="18" fill="#ffffff"></rect>
  <text x="1100" y="629" text-anchor="middle">returns <tspan font-family="Menlo, Consolas, monospace">EvaluationResult</tspan> (mean/std overflow, cost, 95% CI)</text>

  <rect x="890" y="730" width="280" height="18" fill="#ffffff"></rect>
  <text x="1030" y="744" text-anchor="middle" font-family="Menlo, Consolas, monospace">evaluate_candidate(bo_alloc, ...)</text>

  <rect x="1250" y="810" width="230" height="18" fill="#ffffff"></rect>
  <text x="1365" y="824" text-anchor="middle" font-family="Menlo, Consolas, monospace">run_simulation(...)</text>

  <rect x="1240" y="870" width="220" height="18" fill="#ffffff"></rect>
  <text x="1350" y="884" text-anchor="middle">returns <tspan font-family="Menlo, Consolas, monospace">SimulationResult</tspan></text>

  <rect x="890" y="935" width="420" height="18" fill="#ffffff"></rect>
  <text x="1100" y="949" text-anchor="middle">returns <tspan font-family="Menlo, Consolas, monospace">EvaluationResult</tspan> (mean/std overflow, cost, 95% CI)</text>

  <rect x="627" y="1090" width="170" height="18" fill="#ffffff"></rect>
  <text x="712" y="1104" text-anchor="middle">ranked JSON list</text>

  <rect x="295" y="1150" width="170" height="18" fill="#ffffff"></rect>
  <text x="380" y="1164" text-anchor="middle">ranked JSON list</text>
</g>


<g font-size="11.5" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#3f3f46">
