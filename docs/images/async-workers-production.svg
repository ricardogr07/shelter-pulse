  <text x="705" y="490" font-size="12" font-weight="600" fill="#52525b">via boto3</text>

  <rect x="930" y="465" width="180" height="38" fill="#ffffff"></rect>
  <text x="1020" y="479" text-anchor="middle" font-size="12" font-weight="600" fill="#52525b">event source mapping,</text>
  <text x="1020" y="495" text-anchor="middle" font-size="12" font-weight="600" fill="#52525b">batch_size=1</text>

  <rect x="705" y="738" width="150" height="20" fill="#ffffff"></rect>
  <text x="710" y="753" font-size="12" font-weight="600" fill="#52525b">maxReceiveCount 3</text>

  <rect x="1250" y="530" width="140" height="20" fill="#ffffff"></rect>
  <text x="1255" y="545" font-size="12" font-weight="600" fill="#52525b">0.0.0.0/0 route</text>

