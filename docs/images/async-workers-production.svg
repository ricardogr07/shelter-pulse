  <text x="25" y="899" font-size="12" font-weight="600" fill="#52525b">POST /api/internal/jobs/{id}/complete,</text>
  <text x="25" y="915" font-size="12" font-weight="600" fill="#52525b">X-Internal-Key auth</text>

  <rect x="1568" y="490" width="90" height="20" fill="#ffffff"></rect>
