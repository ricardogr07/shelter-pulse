    <text x="230" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#18181b">engine.py</text>
    <text x="230" y="259" text-anchor="middle" font-size="11.5" font-weight="500" fill="#52525b">SimPy discrete-event engine —</text>
    <text x="230" y="273" text-anchor="middle" font-size="11.5" font-weight="500" fill="#52525b">run_simulation(), _cat_process()</text>

    <rect x="60" y="302" width="340" height="78" rx="14" fill="#e8f4e8" stroke="#2d7a2d" stroke-width="1.5"></rect>
