    <text x="230" y="357" text-anchor="middle" font-size="11.5" font-weight="500" fill="#52525b">resolve_intervention() — budget shares → resource deltas</text>

    <rect x="60" y="394" width="340" height="78" rx="14" fill="#e8f4e8" stroke="#2d7a2d" stroke-width="1.5"></rect>
    <text x="230" y="427" text-anchor="middle" font-size="15" font-weight="700" fill="#18181b">montecarlo.py</text>
    <text x="230" y="449" text-anchor="middle" font-size="11.5" font-weight="500" fill="#52525b">run_paired(), make_seed_set() — CRN paired replications</text>

    <rect x="60" y="486" width="340" height="78" rx="14" fill="#e8f4e8" stroke="#2d7a2d" stroke-width="1.5"></rect>
