<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="900" viewBox="0 0 1760 900" font-family="Helvetica, Arial, sans-serif">
  <rect width="1760" height="900" fill="#ffffff"></rect>

  
  <rect x="40" y="70" width="380" height="520" rx="20" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="4 4"></rect>
  <text x="60" y="92" font-size="14" font-weight="700" letter-spacing="0.5" fill="#71717a">core — pure Python, no I/O</text>

  <rect x="450" y="70" width="340" height="520" rx="20" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="4 4"></rect>
  <text x="470" y="92" font-size="14" font-weight="700" letter-spacing="0.5" fill="#71717a">optimize</text>

  <rect x="810" y="70" width="420" height="520" rx="20" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="4 4"></rect>
  <text x="830" y="92" font-size="14" font-weight="700" letter-spacing="0.5" fill="#71717a">queue — async job dispatch</text>

  <rect x="1250" y="70" width="260" height="520" rx="20" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="4 4"></rect>
  <text x="1268" y="92" font-size="14" font-weight="700" letter-spacing="0.5" fill="#71717a">store</text>

