  <g>
    <rect x="60" y="118" width="340" height="78" rx="14" fill="#e8f4e8" stroke="#2d7a2d" stroke-width="1.5"></rect>
    <text x="230" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#18181b">schema.py</text>
    <text x="230" y="167" text-anchor="middle" font-size="11.5" font-weight="500" fill="#52525b">Pydantic v2 models + YAML loader —</text>
    <text x="230" y="181" text-anchor="middle" font-size="11.5" font-weight="500" fill="#52525b">Scenario (frozen), CatIntakeProfile</text>

