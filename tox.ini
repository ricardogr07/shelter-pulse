[tox]
envlist = lint, security, test, e2e
isolated_build = true
requires = tox-uv

[testenv:lint]
dependency_groups = dev
commands =
    pyrefly check shelterpulse/

[testenv:security]
dependency_groups = dev
commands =
    bandit -r shelterpulse/ -c pyproject.toml -ll

[testenv:test]
dependency_groups = dev
commands =
    pytest tests/unit/ -v --cov=shelterpulse --cov-report=term-missing {posargs}

[testenv:e2e]
dependency_groups = dev
commands =
    pytest tests/e2e/ -v {posargs}

[testenv:whitepaper]
skip_install = true
allowlist_externals = pandoc
changedir = {toxinidir}/docs/whitepaper
commands =
    pandoc whitepaper.md --citeproc --bibliography=references.bib --csl=ieee.csl --pdf-engine=pdflatex -V geometry:margin=1in -V fontsize=11pt -o shelterpulse-whitepaper.pdf
