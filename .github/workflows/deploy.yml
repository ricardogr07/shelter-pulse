name: Deploy

on:
  workflow_call:
    inputs:
      version:
        description: "Version to deploy (without v prefix)"
        required: true
        type: string

jobs:
  deploy:
    name: Build and push to ECR
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      lambda_changed: ${{ steps.detect-lambda.outputs.changed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "tag=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect lambda/ changes
        id: detect-lambda
        run: |
          # Find the previous tag to compare against
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found - building worker image"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            LAMBDA_CHANGES=$(git diff --name-only "$PREV_TAG" HEAD -- lambda/ || true)
            if [ -n "$LAMBDA_CHANGES" ]; then
              echo "lambda/ changed since $PREV_TAG:"
              echo "$LAMBDA_CHANGES"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "No lambda/ changes since $PREV_TAG - skipping worker build"
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build and push consolidated image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          target: app
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/shelterpulse:v${{ steps.version.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/shelterpulse:latest

      - name: Build and push worker image
        if: steps.detect-lambda.outputs.changed == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: lambda/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/shelterpulse-worker:v${{ steps.version.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/shelterpulse-worker:latest

      - name: Ensure latest AWS CLI v2 (Express Mode commands)
        if: vars.ECS_EXPRESS_SERVICE_ARN != ''
        run: |
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip.sig" -o awscliv2.zip.sig
          gpg --no-default-keyring --keyring /tmp/aws-cli.gpg \
            --keyserver hkps://keys.openpgp.org \
            --recv-keys FB5DB77FD5C118B80511ADA8A6310180E282A1C0 2>/dev/null || true
          gpg --no-default-keyring --keyring /tmp/aws-cli.gpg \
            --verify awscliv2.zip.sig awscliv2.zip 2>/dev/null || echo "::warning::GPG verification skipped (key server unavailable)"
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - name: Deploy to ECS Express Mode
        if: vars.ECS_EXPRESS_SERVICE_ARN != ''
        env:
          SERVICE_ARN: ${{ vars.ECS_EXPRESS_SERVICE_ARN }}
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/shelterpulse:v${{ steps.version.outputs.tag }}
        run: |
          aws ecs update-express-gateway-service \
            --service-arn "$SERVICE_ARN" \
            --primary-container "{\"image\":\"$IMAGE\",\"containerPort\":8080}" \
            --monitor-resources DEPLOYMENT \
            --monitor-mode TEXT-ONLY

      - name: Update Lambda worker function
        if: steps.detect-lambda.outputs.changed == 'true'
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/shelterpulse-worker:v${{ steps.version.outputs.tag }}
        run: |
          aws lambda update-function-code \
            --function-name shelterpulse-worker \
            --image-uri "$IMAGE" \
            --no-cli-pager || echo "::warning::Lambda update failed (function may not exist yet)"

      - name: Summary
        run: |
          echo "### Deployed v${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${{ steps.ecr-login.outputs.registry }}/shelterpulse:v${{ steps.version.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ vars.ECS_EXPRESS_SERVICE_ARN }}" ]; then
            echo "Updated ECS Express service." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ECS_EXPRESS_SERVICE_ARN not set - image pushed but no service updated." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.detect-lambda.outputs.changed }}" = "true" ]; then
            echo "Worker image: \`${{ steps.ecr-login.outputs.registry }}/shelterpulse-worker:v${{ steps.version.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Lambda function updated." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No lambda/ changes - worker image skipped." >> "$GITHUB_STEP_SUMMARY"
          fi


  smoke-test-api:
    name: Post-deploy smoke test (API)
    needs: deploy
    if: vars.ECS_EXPRESS_SERVICE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Poll until healthy
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::warning::DEPLOY_URL not set, skipping smoke test"
            exit 0
          fi
          for i in $(seq 1 30); do
            curl -fsS "$DEPLOY_URL/api/health" && exit 0
            sleep 5
          done
          echo "::error::API never became healthy after 150s"
          exit 1

      # Fast synchronous layer: every endpoint that doesn't require job polling,
      # with real response-shape assertions (not just 200 status).
      - name: Fast smoke checks
        if: vars.DEPLOY_URL != ''
        run: uv run python scripts/smoke_test.py --url="${{ vars.DEPLOY_URL }}"

      # Async job lifecycle: POST /optimize/builder -> SQS -> Lambda -> webhook
      # -> results. This is the exact chain that broke in production (see
      # docs/adr/014-async-worker-production-hardening.md) and that the fast
      # layer above cannot exercise (it's always 202+job_id in prod).
      - name: Async job lifecycle
        if: vars.DEPLOY_URL != ''
        env:
          SMOKE_BASE_URL: ${{ vars.DEPLOY_URL }}
        run: uv run pytest tests/e2e/test_prod_smoke.py -v
        timeout-minutes: 6

      - name: Rollback instructions
        if: failure()
        run: |
          {
            echo "### :rotating_light: Production smoke test failed"
            echo ""
            echo "The deploy succeeded but post-deploy validation failed against \`${{ vars.DEPLOY_URL }}\`."
            echo "To roll back to the previous image (fill in the previous version tag):"
            echo '```bash'
            echo 'aws ecs update-express-gateway-service \'
            echo '  --service-arn $SERVICE_ARN \'
            echo '  --primary-container "{\"image\":\"$ECR_REPO:v$PREV_VERSION\",\"containerPort\":8080}"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-test-ui:
    name: Post-deploy smoke test (UI, live)
    needs: deploy
    if: vars.ECS_EXPRESS_SERVICE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Cypress against live prod
        if: vars.DEPLOY_URL != ''
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6
        with:
          working-directory: ui
          spec: cypress/e2e/smoke.cy.ts
          config: baseUrl=${{ vars.DEPLOY_URL }}
          env: liveSmoke=true
