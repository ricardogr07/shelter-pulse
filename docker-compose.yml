services:
  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - QUEUE_BACKEND=sync
      - INTERNAL_KEY=dev-key-123
      - DUCKDB_PATH=/app/data/shelterpulse.duckdb
    volumes:
      - shelterpulse-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  ui:
    build:
      context: .
      target: ui
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  shelterpulse-data:
